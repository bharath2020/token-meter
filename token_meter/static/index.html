<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Token Meter</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--panel2:#fbfaf8;--line:#e6e3dd;--text:#1d1c1a;--muted:#6f6b64;--faint:#9a958d;
  --accent:#d9631e;--accent-bg:#fdf1e8;--accent-line:#f2c9ab;
  --ok:#2f8a57;--warn:#b7791f;--warn-bg:#fdf5e3;--bad:#c2412d;
  --s-cr:#7f9cc9;--s-cw:#4fa3a0;--s-out:#d9631e;--s-in:#9b8fb8;--track:#ece9e3;
  --badge:#efece6;--sel:#1d1c1a;--sel-text:#fff;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c0:#a8a69e;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1c1c1a;--panel2:#191917;--line:#2e2d2a;--text:#ecebe7;--muted:#a19d95;--faint:#77736c;
  --accent:#f08a4b;--accent-bg:#2b1f17;--accent-line:#5a3620;
  --ok:#55c08a;--warn:#e0b04f;--warn-bg:#2c2617;--bad:#ef7a66;
  --s-cr:#6d8cc0;--s-cw:#4fb0ad;--s-out:#f08a4b;--s-in:#a597c9;--track:#2a2926;
  --badge:#2a2926;--sel:#ecebe7;--sel-text:#141413;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c0:#62615c;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 12px}
h1{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:650}
.conn{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--badge);font-weight:550;color:var(--text)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.live i{background:var(--ok)}.pill.recon i{background:var(--warn)}.pill.stale i{background:var(--bad)}
.pill.stale{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{background:var(--panel);padding:10px 12px;min-width:0}
.tile.now{background:var(--panel)}
.tile.win{background:var(--panel2);cursor:pointer;border:0;font:inherit;color:inherit;text-align:left}
.tile.win.on{box-shadow:inset 0 -2px 0 var(--text)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:20px;font-weight:600;margin-top:2px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hot .v{color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:6px 2px 0}
.banner{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;overflow-wrap:anywhere}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
.seg{display:inline-flex;background:var(--badge);border-radius:9px;padding:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;min-width:52px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 8rem 5.5rem 7.5rem 18rem;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.thead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 14px;background:var(--panel2)}
.thead .r,.r{text-align:right}
.row.burn{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.row.dim{opacity:.5}
.main{min-width:0}
.nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere;min-width:0}
.title{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--badge);color:var(--muted);white-space:nowrap}
.badge.firstmate{color:var(--text)}
.badge.other{font-style:italic}
.burnb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent-line);padding:0 7px 0 6px;border-radius:999px;background:var(--panel)}
.burnb i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.burnb i{animation:none}}
.flag{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere}
.big{font-weight:600;font-size:14.5px}
.sm{font-size:12px;color:var(--muted)}
.burn .rate .big{color:var(--accent)}
.lbl{display:none}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--track)}
.bar span{display:block;height:100%}
.cr{background:var(--s-cr)}.cw{background:var(--s-cw)}.out{background:var(--s-out)}.in{background:var(--s-in)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.parts b{font-weight:550;color:var(--text)}
.parts span{white-space:nowrap}.parts em{font-style:normal}
.fsplit{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin:8px 2px 0;font-size:12px;color:var(--muted)}
.fsplit .k{white-space:nowrap}.fsplit .bar{flex:1 1 140px;min-width:120px}.fsplit .parts{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0}
.sw{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:0}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
footer{margin-top:16px;font-size:12px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}
.tl{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tlhead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.tlhead h2{font-size:15px;margin:0;font-weight:600}
.tlsub{font-size:12px;color:var(--muted)}
.tlctl{display:flex;gap:8px;flex-wrap:wrap}
#tlsvg{display:block;width:100%;margin-top:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:crosshair;outline:none}
#tlsvg:focus-visible{box-shadow:0 0 0 2px var(--line)}
.ax{fill:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
.gl{stroke:var(--line);stroke-width:1}
.bl{stroke:var(--faint);stroke-width:1}
.hb{fill:var(--text);opacity:.06}.pb{fill:var(--text);opacity:.09}.cr2{fill:var(--text)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.lgd span{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.lgd i{width:9px;height:9px;border-radius:2px;flex:none}
.lgd em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgd b{font-weight:550;color:var(--text)}
.tip{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.tiph{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;color:var(--muted);margin-bottom:4px}
.tiph b{color:var(--text);font-size:13px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,4.8rem);gap:0 8px;align-items:baseline;padding:2px 0;font-variant-numeric:tabular-nums}
.trow>div{text-align:right;white-space:nowrap}
.trow>.tn{text-align:left;display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted)}
.tn span{overflow:hidden;text-overflow:ellipsis}
.trow b{font-weight:600}
.trow.h{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.lk{width:12px;height:2px;border-radius:1px;flex:none}
.trow>.mx{grid-column:1/-1;text-align:left;white-space:normal;font-size:11.5px;color:var(--muted);padding:0 0 2px 18px}
.grp{display:flex;flex-wrap:wrap;gap:2px 12px;margin:2px 0 6px;color:var(--muted)}.grp span{display:inline-flex;align-items:center;gap:5px}.grp b{color:var(--text);font-weight:600}
.mdl{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.mdl b{font-weight:550;color:var(--text)}
@media (max-width:600px){
  .trow{grid-template-columns:repeat(5,minmax(0,1fr));gap:0 6px;padding:3px 0}
  .trow>.tn{grid-column:1/-1}
  .trow.h>.tn{display:none}
  .xl{display:none}
}
@media (max-width:900px){
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .strip .wins{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
}
@media (min-width:901px){.strip .wins{display:contents}}
@media (max-width:720px){
  .thead{display:none}
  .row{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"main main main" "rate last win" "split split split";gap:8px 10px;padding:12px;align-items:start}
  .main{grid-area:main}.rate{grid-area:rate}.last{grid-area:last}.wc{grid-area:win}.split{grid-area:split}
  .r{text-align:left}
  .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .parts{grid-template-columns:repeat(4,auto);justify-content:space-between}
}
@media (max-width:520px){
  .strip .wins{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:8px 10px}
  .tile .v{font-size:17px}
  .parts{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Token Meter</h1>
    <div class="conn"><span id="pill" class="pill"><i></i><span id="pillText">connecting</span></span><span id="ago" class="num">waiting for data</span></div>
  </header>

  <section class="strip" id="strip" aria-label="Fleet totals"></section>
  <div class="fsplit" id="fsplit"></div>
  <p class="note" id="note">API-equiv. cost at list prices</p>
  <div id="fleetFlag"></div>

  <section class="tl" aria-label="Burn timeline">
    <div class="tlhead">
      <div><h2>Burn over time</h2><div class="tlsub" id="tlsub">loading timeline…</div></div>
      <div class="tlctl">
        <div class="seg" role="group" aria-label="Timeline range" id="tlRange"><button type="button" data-v="48h">48h</button><button type="button" data-v="6h">6h</button></div>
        <div class="seg" role="group" aria-label="Colour by" id="tlBy"><button type="button" data-v="worker">worker</button><button type="button" data-v="model">model</button><button type="button" data-v="effort">effort</button></div>
        <div class="seg" role="group" aria-label="Timeline metric" id="tlMetric"><button type="button" data-v="cost">cost</button><button type="button" data-v="tokens">tokens</button></div>
      </div>
    </div>
    <svg id="tlsvg" tabindex="0" role="img" aria-label="Stacked bars of burn per time bucket by worker; use arrow keys to inspect buckets"></svg>
    <div class="lgd" id="tllgd"></div>
    <div class="tip" id="tltip" aria-live="polite"></div>
  </section>

  <div class="controls">
    <div class="seg" role="group" aria-label="Window for per-worker breakdown" id="seg">
      <button type="button" data-w="5m">5m</button><button type="button" data-w="1h">1h</button><button type="button" data-w="today">today</button><button type="button" data-w="48h">48h</button>
    </div>
    <label class="tog"><input type="checkbox" id="hideOther"> Hide not-fleet work <span id="hiddenN"></span></label>
  </div>

  <section class="list" id="list" aria-live="off"><div class="empty">Waiting for the first snapshot…</div></section>

  <footer><span id="fnote">API-equiv. cost at list prices</span><span id="scan"></span><span>read-only view</span></footer>
</div>
<script>
(function(){
"use strict";
var WINS=["5m","1h","today","48h"], WLBL={"5m":"5 min","1h":"1 hour","today":"Today","48h":"48 hours"};
var KIND={firstmate:"firstmate",secondmate:"second mate",worker:"worker",other:"not fleet"};
var st={win:"1h",hideOther:false};
try{var sw=localStorage.getItem("tm.window");if(WINS.indexOf(sw)>=0)st.win=sw;st.hideOther=localStorage.getItem("tm.hideOther")==="1";}catch(e){}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var snap=null, recvAt=0, mode="connecting";
var $=function(id){return document.getElementById(id)};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(x){return typeof x==="number"&&isFinite(x)?x:0}
function fT(v){v=n(v);var a=Math.abs(v);
  if(a>=1e9)return (v/1e9).toFixed(a<1e10?2:1)+"B";
  if(a>=1e6)return (v/1e6).toFixed(a<1e7?2:1).replace(/\.0+$/,"")+"M";
  if(a>=1e3)return (v/1e3).toFixed(a<1e4?1:0).replace(/\.0$/,"")+"K";
  return String(Math.round(v));}
function fC(v){v=n(v);if(v===0)return "$0";var a=Math.abs(v);
  if(a<0.001)return "<$0.001";if(a<0.01)return "$"+v.toFixed(3);
  if(a<1000)return "$"+v.toFixed(2);
  return "$"+Math.round(v).toLocaleString("en-US");}
function fAgo(sec){sec=Math.max(0,Math.floor(sec));
  if(sec<60)return sec+"s ago";if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";return Math.floor(sec/86400)+"d ago";}
// server-clock "now": avoids client/server skew
function sNow(){return snap?n(snap.generated_at)+(Date.now()/1000-recvAt):Date.now()/1000}
function B(o,w){var b=(o&&o.windows&&o.windows[w])||{};return {t:b.tokens||{},c:b.cost||{},calls:n(b.calls)}}

function renderStrip(){
  var f=snap.fleet||{}, h="";
  var rate=n(f.rate_usd_per_hour), burn=n(f.burning_count);
  h+='<div class="tile now'+(burn?" hot":"")+'"><div class="k">Burn rate</div><div class="v num">'+fC(rate)+'<span class="sm">/h</span></div><div class="s">API-equiv. · 5m avg</div></div>';
  h+='<div class="tile now'+(burn?" hot":"")+'"><div class="k">Tokens / min</div><div class="v num">'+fT(f.tokens_per_min)+'</div><div class="s">across fleet</div></div>';
  h+='<div class="tile now'+(burn?" hot":"")+'"><div class="k">Burning</div><div class="v num">'+burn+'<span class="sm"> / '+n(f.worker_count)+'</span></div><div class="s">workers active</div></div>';
  h+='<div class="wins">';
  WINS.forEach(function(w){var b=B(f,w);
    h+='<button type="button" class="tile win'+(w===st.win?" on":"")+'" data-w="'+w+'" aria-label="Show '+WLBL[w]+' breakdown"><div class="k">'+WLBL[w]+'</div><div class="v num">'+fC(b.c.total)+'</div><div class="s num">'+fT(b.t.total)+' tok · '+fT(b.calls)+' calls</div></button>';});
  h+='</div>';
  $("strip").innerHTML=h;
  var fb=B(f,st.win);
  $("fsplit").innerHTML='<span class="k">Fleet '+esc(WLBL[st.win])+': <b class="num" style="color:var(--text)">'+fC(fb.c.total)+'</b></span>'+split(fb.t,fb.c);
  var pn=esc(snap.pricing_note||"API-equivalent cost at list prices");
  $("note").innerHTML="Costs: "+pn;
  $("fnote").innerHTML=pn;
  var um=snap.unknown_models||[];
  $("fleetFlag").innerHTML=um.length?'<div class="banner">⚠ Unpriced model'+(um.length>1?"s":"")+' (cost excluded): '+um.map(esc).join(", ")+'</div>':"";
  var sc=snap.scan||{};
  $("scan").textContent=n(sc.files)+" files scanned · startup "+n(sc.startup_seconds).toFixed(1)+"s";
}

function split(t,c){c=c||{};
  var p=[["cr","read",n(t.cache_read),c.cache_read],["cw","write",n(t.cache_write),c.cache_write],["out","out",n(t.output),c.output],["in","in",n(t.input),c.input]];
  var tot=p.reduce(function(a,x){return a+x[2]},0), bar="", nums="";
  p.forEach(function(x){
    if(tot>0&&x[2]>0)bar+='<span class="'+x[0]+'" style="width:'+(x[2]/tot*100).toFixed(2)+'%" title="'+(x[1]==="read"?"cache read":x[1]==="write"?"cache write":x[1]==="out"?"output":"input")+'"></span>';
    nums+='<span><i class="sw '+x[0]+'"></i>'+x[1]+' <b class="num">'+fT(x[2])+'</b> <em class="num">· '+fC(x[3])+'</em></span>';});
  return '<div class="bar" aria-hidden="true">'+bar+'</div><div class="parts">'+nums+'</div>';
}

function renderList(){
  var all=snap.workers||[], hidden=0, w=st.win;
  var rows=all.filter(function(x){if(st.hideOther&&x.kind==="other"){hidden++;return false}return true});
  $("hiddenN").textContent=hidden?"("+hidden+" hidden)":"";
  var h='<div class="row thead"><div>Worker</div><div class="r">Now</div><div class="r">Last active</div><div class="r">'+esc(WLBL[w])+'</div><div>Token split</div></div>';
  if(!rows.length){$("list").innerHTML=h+'<div class="empty">'+(all.length?"All rows hidden by filter.":"No Claude Code sessions in the last 48 hours.")+'</div>';return;}
  rows.forEach(function(x){
    var b=B(x,w), burning=!!x.burning, kind=KIND[x.kind]?x.kind:"other";
    var dim=!burning&&n(b.t.total)===0;
    var um=x.unknown_models||[];
    var models=(x.models||[]).join(", ");
    var tip="sessions: "+n(x.sessions)+(models?" · models: "+models:"")+(x.owner?" · owner: "+x.owner:"");
    h+='<div class="row'+(burning?" burn":"")+(dim?" dim":"")+'" title="'+esc(tip)+'">';
    h+='<div class="main"><div class="nm">'+(burning?'<span class="burnb"><i></i>BURNING</span>':"")+'<span class="name">'+esc(x.name||x.key)+'</span><span class="badge '+kind+'">'+KIND[kind]+'</span></div>';
    if(x.title)h+='<div class="title" title="'+esc(x.title)+'">'+esc(x.title)+'</div>';
    var mx=x.mix||[];
    if(x.current_model||x.current_effort||mx.length>1){
      h+='<div class="mdl">'+(x.current_model||x.current_effort?'<b>'+esc(me(x.current_model,x.current_effort))+'</b>':"");
      if(mx.length>1)h+=(x.current_model||x.current_effort?" · ":"")+"48h: "+mx.slice(0,4).map(function(m){return esc(me(m.model,m.effort))+" "+fC(m.cost)}).join(", ")+(mx.length>4?" +"+(mx.length-4)+" more":"");
      h+='</div>';}
    if(um.length)h+='<span class="flag">⚠ unpriced model: '+um.map(esc).join(", ")+'</span>';
    h+='</div>';
    var r=n(x.rate_usd_per_hour), tpm=n(x.tokens_per_min);
    h+='<div class="rate r"><span class="lbl">Now</span><div class="big num">'+(r||tpm?fC(r)+'<span class="sm">/h</span>':'<span class="muted">—</span>')+'</div><div class="sm num">'+(tpm?fT(tpm)+" tok/min":"idle")+'</div></div>';
    h+='<div class="last r"><span class="lbl">Last active</span><div class="num" data-t="'+(x.last_activity==null?"":n(x.last_activity))+'">'+(x.last_activity==null?"—":fAgo(sNow()-n(x.last_activity)))+'</div></div>';
    h+='<div class="wc r"><span class="lbl">'+esc(WLBL[w])+'</span><div class="big num">'+fC(b.c.total)+'</div><div class="sm num">'+fT(b.t.total)+' tok</div></div>';
    h+='<div class="split">'+split(b.t,b.c)+'</div>';
    h+='</div>';
  });
  $("list").innerHTML=h;
}

function render(){
  if(!snap)return;
  renderStrip();renderList();
  var f=snap.fleet||{};
  document.title=(n(f.burning_count)?"● ":"")+fC(f.rate_usd_per_hour)+"/h · Token Meter";
}
function syncSeg(){[].forEach.call($("seg").children,function(b){b.setAttribute("aria-pressed",b.dataset.w===st.win?"true":"false")})}
function setWin(w){if(WINS.indexOf(w)<0||w===st.win)return;st.win=w;save("tm.window",w);syncSeg();render()}

$("seg").addEventListener("click",function(e){var b=e.target.closest("button[data-w]");if(b)setWin(b.dataset.w)});
$("strip").addEventListener("click",function(e){var b=e.target.closest("button[data-w]");if(b)setWin(b.dataset.w)});
var ho=$("hideOther");ho.checked=st.hideOther;
ho.addEventListener("change",function(){st.hideOther=ho.checked;save("tm.hideOther",ho.checked?"1":"0");render()});
syncSeg();

// ---- timeline ----
var CATS=[["cache_read","read"],["cache_write","write"],["output","out"],["input","in"]];
var TL={data:null,range:"6h",metric:"cost",by:"worker",hover:null,pin:null,last:0,busy:false,slots:{},g:null};
try{var tb=localStorage.getItem("tm.tlBy");if(tb==="worker"||tb==="model"||tb==="effort")TL.by=tb;}catch(e){}
try{var tr=localStorage.getItem("tm.tlRange"),tm=localStorage.getItem("tm.tlMetric");if(tr==="48h"||tr==="6h")TL.range=tr;if(tm==="cost"||tm==="tokens")TL.metric=tm;}catch(e){}
var svg=$("tlsvg");
function tlFetch(){
  if(TL.busy)return;TL.busy=true;TL.last=Date.now();
  fetch("api/timeline",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){if(j&&j.ranges){TL.data=j;tlRender()}}).catch(function(){})
    .then(function(){TL.busy=false});
}
function tlMaybe(){if(Date.now()-TL.last>=(mode==="polling"?15000:10000))tlFetch()}
var EPREF={high:2,medium:1,low:3,"default":4,unknown:0};
function pref(s){var k=String(s.key||"");
  if(s.kind==="effort")return EPREF.hasOwnProperty(k)?EPREF[k]:null;
  if(s.kind==="model"){if(/opus/.test(k))return 1;if(/sonnet/.test(k))return 2;if(/haiku/.test(k))return 3;if(!k||/unknown|synthetic/.test(k))return 0}
  return null}
function slotsFor(rk,ser){
  var prev=TL.slots[rk]||{},used={},out={};
  ser.forEach(function(s){var p=pref(s);if(p)used[p]="pref"});
  ser.forEach(function(s){var k=prev["k:"+s.key];if(pref(s)==null&&s.kind!=="others"&&k&&!used[k])used[k]="k:"+s.key});
  ser.forEach(function(s){
    var id="k:"+s.key,p=pref(s);if(s.kind==="others"||p===0){out[id]=0;return}
    if(p){out[id]=p;return}
    var k=prev[id];if(!k||used[k]!==id){for(k=1;k<=6&&used[k];k++);}if(k>6)k=0;else used[k]=id;
    out[id]=k;});
  TL.slots[rk]=out;return out;
}
function tv(s,c,i){var o=TL.metric==="cost"?s.cost:s.tokens;return n(o&&o[c]&&o[c][i])}
function fM(v){return TL.metric==="cost"?fC(v):fT(v)}
function niceStep(max){var raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function tickLbl(v,step){if(TL.metric!=="cost")return fT(v);var d=0;while(d<4&&Math.abs(Math.round(step*Math.pow(10,d))-step*Math.pow(10,d))>1e-9)d++;return "$"+v.toFixed(d)}
function hm(dt){return ("0"+dt.getHours()).slice(-2)+":"+("0"+dt.getMinutes()).slice(-2)}
var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function shortM(m){return String(m||"?").replace(/^claude-/,"")}
function me(m,e){return [m?shortM(m):"",e||""].filter(Boolean).join(" · ")}
function sname(s){return TL.by==="model"?shortM(s.name||s.key):(s.name||s.key)}
function syncTl(){
  [].forEach.call($("tlBy").children,function(b){b.setAttribute("aria-pressed",b.dataset.v===TL.by?"true":"false")});
  [].forEach.call($("tlRange").children,function(b){b.setAttribute("aria-pressed",b.dataset.v===TL.range?"true":"false")});
  [].forEach.call($("tlMetric").children,function(b){b.setAttribute("aria-pressed",b.dataset.v===TL.metric?"true":"false")});
}
function tlRender(){
  syncTl();
  var d=TL.data,R=d&&d.ranges&&d.ranges[TL.range];
  if(!R){svg.innerHTML="";TL.g=null;$("tllgd").innerHTML="";$("tltip").innerHTML="";$("tlsub").textContent=d?"No data for this range":"loading timeline…";return}
  var N=Math.max(0,n(R.buckets)|0),bs=n(R.bucket_seconds)||900,t0=n(R.start),wser=R.series||[],ser=(TL.by==="worker"?wser:TL.by==="model"?R.by_model:R.by_effort)||[],sl=slotsFor(TL.by==="worker"?TL.range:TL.by,ser);
  var tot=[],i,j,max=0;
  for(i=0;i<N;i++){var t=0;for(j=0;j<ser.length;j++)for(var c=0;c<4;c++)t+=tv(ser[j],CATS[c][0],i);tot.push(t);if(t>max)max=t}
  var W=Math.max(280,svg.parentNode.clientWidth-28),H=W<500?170:210,ml=46,mr=4,mt=14,mb=22,pw=W-ml-mr,ph=H-mt-mb;
  var step=max>0?niceStep(max):(TL.metric==="cost"?0.25:1000),top=Math.max(step,Math.ceil(max/step-1e-9)*step);
  var slot=N?pw/N:pw,bw=Math.min(24,slot>=4?slot-(slot>=8?2:1):slot),h="";
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("height",H);
  for(var v=0;v<=top+1e-9;v+=step){var y=(mt+ph-v/top*ph).toFixed(1);
    h+='<line class="'+(v?"gl":"bl")+'" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(ml-6)+'" y="'+y+'" dy="3.5" text-anchor="end">'+tickLbl(v,step)+'</text>';}
  var stepH=TL.range==="6h"?1:(pw<420?12:pw<800?6:3);
  for(i=0;i<=N;i++){var dt=new Date((t0+i*bs)*1000),x=ml+i*slot;
    if(dt.getMinutes()||dt.getHours()%stepH||x<ml+14||x>W-16)continue;
    h+='<line class="gl" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(mt+ph)+'" y2="'+(mt+ph+4)+'"/><text class="ax" x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+(dt.getHours()?hm(dt):WD[dt.getDay()])+'</text>';}
  h+='<rect id="tlpb" class="pb" y="'+mt+'" height="'+ph+'" width="0"/><rect id="tlhb" class="hb" y="'+mt+'" height="'+ph+'" width="0"/><path id="tlcaret" class="cr2" d=""/>';
  for(i=0;i<N;i++){if(!tot[i])continue;
    var x0=ml+i*slot+(slot-bw)/2,yb=mt+ph,first=true,segs=[];
    for(j=0;j<ser.length;j++){var sv=0;for(c=0;c<4;c++)sv+=tv(ser[j],CATS[c][0],i);if(sv<=0)continue;
      var hh=sv/top*ph,gap=(!first&&hh>3)?2:0;segs.push([yb-hh,hh-gap,sl["k:"+ser[j].key]]);yb-=hh;first=false;}
    segs.forEach(function(sg,k){var y=sg[0],hh=sg[1],r=k===segs.length-1?Math.min(4,bw/2,hh):0,X=x0.toFixed(1),st=' style="fill:var(--c'+sg[2]+')"';
      if(hh<=0)return;
      if(r<0.6)h+='<rect x="'+X+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'"'+st+'/>';
      else h+='<path d="M'+X+','+(y+hh).toFixed(1)+'V'+(y+r).toFixed(1)+'Q'+X+','+y.toFixed(1)+' '+(x0+r).toFixed(1)+','+y.toFixed(1)+'H'+(x0+bw-r).toFixed(1)+'Q'+(x0+bw).toFixed(1)+','+y.toFixed(1)+' '+(x0+bw).toFixed(1)+','+(y+r).toFixed(1)+'V'+(y+hh).toFixed(1)+'Z"'+st+'/>';});
  }
  svg.innerHTML=h;
  TL.g={N:N,bs:bs,t0:t0,ml:ml,mt:mt,slot:slot,ser:ser,wser:wser,sl:sl,tot:tot,W:W};
  var rt=[];ser.forEach(function(s){var t=0;for(i=0;i<N;i++)for(c=0;c<4;c++)t+=tv(s,CATS[c][0],i);rt.push(t)});
  $("tllgd").innerHTML=ser.map(function(s,k){return '<span title="'+esc(s.name)+'"><i style="background:var(--c'+sl["k:"+s.key]+')"></i><em>'+esc(sname(s))+'</em><b class="num">'+fM(rt[k])+'</b></span>'}).join("");
  $("tlsub").textContent=(TL.metric==="cost"?"API-equiv. cost":"Tokens")+" per "+Math.round(bs/60)+"-min bucket, by "+TL.by+" · last "+TL.range;
  tlMark();
}
function idxOf(t){var g=TL.g;if(!g||t==null)return null;var i=Math.round((t-g.t0)/g.bs);return i>=0&&i<g.N?i:null}
function tlMark(){
  var g=TL.g;if(!g)return;
  var hi=idxOf(TL.hover),pi=idxOf(TL.pin);
  [["tlhb",hi],["tlpb",pi]].forEach(function(a){var el=document.getElementById(a[0]);if(!el)return;
    if(a[1]==null)el.setAttribute("width","0");else{var w=Math.max(10,g.slot);el.setAttribute("x",(g.ml+(a[1]+.5)*g.slot-w/2).toFixed(1));el.setAttribute("width",w.toFixed(1))}});
  var cr=document.getElementById("tlcaret"),ci=hi!=null?hi:pi;
  if(cr){if(ci==null)cr.setAttribute("d","");else{var cx=g.ml+(ci+.5)*g.slot;cr.setAttribute("d","M"+(cx-4).toFixed(1)+",2H"+(cx+4).toFixed(1)+"L"+cx.toFixed(1)+","+(g.mt-3)+"Z")}}
  var i=hi!=null?hi:pi!=null?pi:g.N-1;if(i<0){$("tltip").innerHTML="";return}
  var a=new Date((g.t0+i*g.bs)*1000),b=new Date((g.t0+(i+1)*g.bs)*1000);
  var hint=hi!=null?"hover":pi!=null?"pinned · tap again to release":"latest · hover or tap a bar";
  var h='<div class="tiph"><span><b>'+WD[a.getDay()]+" "+hm(a)+"–"+hm(b)+'</b>'+(i===g.N-1?" (in progress)":"")+' · <b class="num">'+fM(g.tot[i])+'</b></span><span>'+hint+'</span></div>';
  var rows="",wk=TL.by==="worker";
  if(!wk){var gp="";g.ser.forEach(function(s){var t=0;CATS.forEach(function(c){t+=tv(s,c[0],i)});if(t)gp+='<span><i class="lk" style="background:var(--c'+g.sl["k:"+s.key]+')"></i>'+esc(sname(s))+' <b class="num">'+fM(t)+'</b></span>'});
    if(gp)h+='<div class="grp">'+gp+'</div>';}
  g.wser.forEach(function(s){var vals=CATS.map(function(c){return tv(s,c[0],i)}),t=vals.reduce(function(x,y){return x+y},0);if(!t)return;
    var mx=(s.mix&&s.mix[i])||[],mxs=mx.map(function(m){return esc(me(m.model,m.effort))+" "+fC(m.cost)+(TL.metric==="tokens"?" / "+fT(m.tokens):"")}).join(", ");
    rows+='<div class="trow"><div class="tn">'+(wk?'<i class="lk" style="background:var(--c'+g.sl["k:"+s.key]+')"></i>':"")+'<span title="'+esc(s.name)+'">'+esc(s.name||s.key)+'</span></div><div><b>'+fM(t)+'</b></div>'+vals.map(function(v){return '<div>'+fM(v)+'</div>'}).join("")+(mxs?'<div class="mx">'+mxs+'</div>':"")+'</div>';});
  h+=rows?'<div class="trow h"><div class="tn">Worker</div><div>total</div><div><span class="xl">cache </span>read</div><div><span class="xl">cache </span>write</div><div>out<span class="xl">put</span></div><div>in<span class="xl">put</span></div></div>'+rows:'<div class="muted">No burn in this bucket.</div>';
  $("tltip").innerHTML=h;
}
function evIdx(e){var g=TL.g;if(!g)return null;var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*(g.W/r.width)-g.ml,i=Math.floor(x/g.slot);return i>=0&&i<g.N?i:null}
function tOf(i){return i==null?null:TL.g.t0+i*TL.g.bs}
svg.addEventListener("pointermove",function(e){if(e.pointerType!=="mouse")return;var t=tOf(evIdx(e));if(t!==TL.hover){TL.hover=t;tlMark()}});
svg.addEventListener("pointerleave",function(){if(TL.hover!=null){TL.hover=null;tlMark()}});
svg.addEventListener("click",function(e){var t=tOf(evIdx(e));if(t==null)return;TL.pin=TL.pin===t?null:t;TL.hover=null;tlMark()});
svg.addEventListener("keydown",function(e){var g=TL.g;if(!g||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"&&e.key!=="Escape"))return;e.preventDefault();
  if(e.key==="Escape"){TL.pin=null}else{var i=idxOf(TL.pin);i=i==null?g.N-1:i+(e.key==="ArrowLeft"?-1:1);TL.pin=tOf(Math.max(0,Math.min(g.N-1,i)))}tlMark()});
$("tlRange").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(!b||b.dataset.v===TL.range)return;TL.range=b.dataset.v;TL.pin=TL.hover=null;save("tm.tlRange",TL.range);tlRender()});
$("tlBy").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(!b||b.dataset.v===TL.by)return;TL.by=b.dataset.v;save("tm.tlBy",TL.by);tlRender()});
$("tlMetric").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(!b||b.dataset.v===TL.metric)return;TL.metric=b.dataset.v;save("tm.tlMetric",TL.metric);tlRender()});
var rzT;window.addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(tlRender,150)});
syncTl();tlFetch();

function accept(data){
  var s;try{s=typeof data==="string"?JSON.parse(data):data}catch(e){return false}
  if(!s||typeof s!=="object")return false;
  if(snap&&n(s.generated_at)<n(snap.generated_at))return true;
  snap=s;recvAt=Date.now()/1000;render();tick();tlMaybe();return true;
}

// ---- transport: SSE preferred, polling fallback ----
var es=null, errs=0, pollT=null;
function setMode(m){mode=m;tick()}
function startPoll(){
  if(pollT)return;
  if(es){try{es.close()}catch(e){}es=null}
  setMode("polling");
  var go=function(){
    fetch("api/snapshot",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){if(accept(j))setMode("polling")}).catch(function(){setMode("reconnecting")})
      .then(function(){pollT=setTimeout(go,3000)});
  };
  go();
}
function startSSE(){
  if(!window.EventSource){startPoll();return}
  try{es=new EventSource("events")}catch(e){startPoll();return}
  es.onopen=function(){setMode("live")};
  es.onmessage=function(e){if(accept(e.data)){errs=0;setMode("live")}};
  es.onerror=function(){
    errs++;
    if(errs>=3||(es&&es.readyState===2))startPoll();else setMode("reconnecting");
  };
}
// fast first paint while SSE connects
fetch("api/snapshot",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j)accept(j)}).catch(function(){});
startSSE();

function tick(){
  var age=snap?Date.now()/1000-recvAt:Infinity, p=$("pill"), cls, txt;
  if(snap&&age>10){cls="stale";txt="stale"}
  else if(mode==="live"){cls="live";txt="live"}
  else if(mode==="polling"){cls=snap?"live":"recon";txt=snap?"live (polling)":"polling"}
  else if(mode==="reconnecting"){cls="recon";txt="reconnecting"}
  else{cls="";txt="connecting"}
  p.className="pill "+cls;$("pillText").textContent=txt;
  $("ago").textContent=snap?"updated "+fAgo(age):"waiting for data";
  if(snap){var now=sNow();
    [].forEach.call(document.querySelectorAll("[data-t]"),function(el){var t=el.getAttribute("data-t");if(t!=="")el.textContent=fAgo(now-Number(t))});}
}
setInterval(tick,1000);
})();
